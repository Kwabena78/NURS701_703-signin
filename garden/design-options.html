<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chartwell Front Yard Options</title>
<style>
  body{font-family:system-ui,sans-serif;margin:16px;background:#fafafa;color:#222}
  h1{font-size:1.3rem;margin:0 0 4px}
  .note{color:#a00;font-size:.85rem;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  figure{margin:0;background:#fff;border:1px solid #ddd;padding:8px}
  figcaption{font-size:.9rem;margin-top:6px}
  svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<h1>Chartwell front yard: three sample designs</h1>
<div class="note">Schematic sketches, assumed 14 m x 5.5 m frontage, not to scale. Final drawing follows once measured. Details in design-options.md.</div>
<div class="grid" id="grid"></div>
<script>
const W=400,H=270,K=20; // 1 m = 20 px
function base(){return `
<rect width="${W}" height="${H}" fill="#fff"/>
<rect x="10" y="10" width="380" height="30" fill="#333"/>
<text x="200" y="30" fill="#fff" text-anchor="middle" font-size="10">HOUSE</text>
<rect x="10" y="40" width="380" height="190" fill="#a8d08d"/>
<rect x="215" y="40" width="90" height="190" fill="#666"/>
<rect x="180" y="40" width="30" height="190" fill="#999"/>
<rect x="210" y="40" width="5" height="190" fill="#c9b458"/>
<rect x="10" y="230" width="380" height="5" fill="#bbb"/>
<rect x="10" y="235" width="380" height="25" fill="#444"/>
<text x="200" y="252" fill="#fff" text-anchor="middle" font-size="9">STREET</text>
<rect x="12" y="185" width="14" height="9" fill="#5a7a3a"/>
<rect x="10" y="45" width="40" height="4" fill="#111"/>`}
const bed=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#6b4f36" fill-opacity=".75"/>`;
const dot=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const t=(x,y,s)=>`<text x="${x}" y="${y}" font-size="8" text-anchor="middle">${s}</text>`;
const hedgeR=(c)=>`<rect x="350" y="42" width="40" height="185" fill="#6b4f36" fill-opacity=".75"/><rect x="360" y="46" width="18" height="178" fill="${c}" fill-opacity=".9"/>`;
const pots=`${dot(178,48,5,'#111')}${dot(214,48,5,'#111')}`;
const opts=[
 {n:"Option 1: Layered Edge",d:"Kōwhai specimen, grass blocks, clipped hedge backdrop.",
  s:bed(10,100,120,90)+dot(70,140,13,'#e8c400')+t(70,144,'kōwhai')+`<rect x="40" y="160" width="40" height="20" fill="#8fbf5a"/>`+t(60,173,'Lomandra')+`<rect x="95" y="110" width="30" height="16" fill="#b5c4c4"/>`+t(110,121,'Astelia')+`<rect x="12" y="150" width="14" height="45" fill="#2f6b3a" fill-opacity=".85"/>`+hedgeR('#2f6b3a')+pots},
 {n:"Option 2: Native Modern",d:"All native, layered texture, mixed screen, no formal clipping.",
  s:bed(10,90,140,110)+dot(50,130,12,'#7a8a3a')+t(50,134,'tī kōuka')+dot(95,120,8,'#e08a20')+t(95,124,'Libertia')+dot(115,160,9,'#b5c4c4')+t(115,164,'Astelia')+dot(35,175,8,'#8fbf5a')+t(35,179,'Carex')+
    `<rect x="350" y="42" width="40" height="185" fill="#6b4f36" fill-opacity=".75"/>`+[0,1,2,3,4,5].map(i=>dot(370,60+i*30,10,i%2?'#4a7a3a':'#6a9a4a')).join('')+pots},
 {n:"Option 3: Formal Clean",d:"Symmetry, magnolia pair, uniform hedge, strict lawn rectangle.",
  s:bed(10,60,165,25)+bed(10,100,60,90)+bed(305,60,45,25)+dot(40,120,12,'#2f6b3a')+dot(40,165,12,'#2f6b3a')+t(40,143,'Magnolia')+`<rect x="80" y="110" width="80" height="70" fill="#8fbf5a" fill-opacity=".3"/>`+`<rect x="12" y="150" width="14" height="45" fill="#2f6b3a" fill-opacity=".85"/>`+hedgeR('#2f6b3a')+pots}
];
document.getElementById('grid').innerHTML=opts.map(o=>`<figure><svg viewBox="0 0 ${W} ${H}">${base()}${o.s}</svg><figcaption><b>${o.n}</b><br>${o.d}</figcaption></figure>`).join('');
</script>
</body>
</html>
